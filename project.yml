# XcodeGen spec, for debugging in Xcode. The primary build is SwiftPM + build.sh.
#
#   brew install xcodegen && xcodegen && open LiteKey.xcodeproj
#
# Libraries come from the SwiftPM package at the repo root (local package); sources are not redeclared.
# The app target compiles only the app layer (Sources/LiteKey); LiteKeyEngine/Core/Platform are package products.
# Change the bundle ID here via BUNDLE_ID, or with `xcodebuild BUNDLE_ID=com.yourname.litekey ...`.
name: LiteKey

options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID: com.litekey.app
    MARKETING_VERSION: 1.1.1
    CURRENT_PROJECT_VERSION: 1.1.1
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"

packages:
  LiteKey:
    path: .

targets:
  LiteKey:
    type: application
    platform: macOS
    sources:
      - path: Sources/LiteKey
      - path: Resources/LiteKey.icns
        buildPhase: resources
    dependencies:
      - package: LiteKey
        product: LiteKeyEngine
      - package: LiteKey
        product: LiteKeyCore
      - package: LiteKey
        product: LiteKeyPlatform
    settings:
      base:
        PRODUCT_NAME: LiteKey
        # Avoid clashing with the package's "LiteKey" executable target module
        PRODUCT_MODULE_NAME: LiteKeyApp
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # "Sign to Run Locally". Pick a team in Xcode to keep the Accessibility permission across builds.
        # Team: `LITEKEY_TEAM=<Team ID> xcodegen`. If unset, XcodeGen keeps the literal and Xcode resolves it to empty.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${LITEKEY_TEAM}
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    scheme: {}
